openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: On-demand public-landmark location analysis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/status:
    get:
      operationId: getAiStatus
      tags: [ai]
      summary: Check whether server-side OpenAI is configured
      responses:
        "200":
          description: AI configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatusResponse"
  /ai/landmark-analysis:
    post:
      operationId: analyzeLandmarks
      tags: [ai]
      summary: Analyze selected photos or sampled video frames for public landmarks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LandmarkAnalysisInput"
      responses:
        "200":
          description: Estimated public landmark and location confidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandmarkAnalysisResult"
        "400":
          description: Invalid image or metadata input
        "429":
          description: Analysis rate limit reached
        "503":
          description: OpenAI is not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiStatusResponse:
      type: object
      properties:
        configured:
          type: boolean
        model:
          type: string
      required: [configured, model]
    LandmarkAnalysisFrame:
      type: object
      properties:
        dataUrl:
          type: string
          maxLength: 1100000
          pattern: "^data:image/jpeg;base64,"
        timeSeconds:
          type: number
          minimum: 0
      required: [dataUrl, timeSeconds]
    LandmarkCoordinates:
      type: object
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required: [latitude, longitude]
    LandmarkAnalysisInput:
      type: object
      properties:
        frames:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/LandmarkAnalysisFrame"
        capturedAt:
          type: ["string", "null"]
          format: date-time
        coordinates:
          $ref: "#/components/schemas/LandmarkCoordinates"
      required: [frames]
    LandmarkConfidence:
      type: object
      properties:
        value:
          type: ["string", "null"]
          maxLength: 120
        confidence:
          type: integer
          minimum: 0
          maximum: 100
      required: [value, confidence]
    LandmarkAnalysisResult:
      type: object
      properties:
        landmarkName:
          type: ["string", "null"]
          maxLength: 160
        landmarkType:
          type: ["string", "null"]
          maxLength: 120
        street:
          $ref: "#/components/schemas/LandmarkConfidence"
        city:
          $ref: "#/components/schemas/LandmarkConfidence"
        region:
          $ref: "#/components/schemas/LandmarkConfidence"
        country:
          $ref: "#/components/schemas/LandmarkConfidence"
        evidence:
          type: string
          maxLength: 600
      required: [landmarkName, landmarkType, street, city, region, country, evidence]

